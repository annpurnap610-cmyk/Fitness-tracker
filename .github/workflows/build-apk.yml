name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: []

jobs:
  build-and-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $2}')
          fi
          
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_VERSION"
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer, found version $JAVA_VERSION."
            exit 1
          fi
          echo "Java version check passed successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create debug.keystore."
              exit 1
            fi
            echo "debug.keystore generated successfully."
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK existence
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH."
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK verification passed: $APK_PATH is valid."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p release_asset_dir
          REPO_NAME="${{ github.event.repository.name }}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_asset_dir/$ASSET_NAME"
          
          if [ ! -f "release_asset_dir/$ASSET_NAME" ]; then
            echo "Error: Release asset copy failed."
            exit 1
          fi
          
          echo "asset_path=release_asset_dir/$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist at $ASSET_PATH."
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          echo "Creating GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --latest \
            --notes "This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions run number: ${{ github.run_number }}
          - GitHub Actions run attempt: ${{ github.run_attempt }}
          - Source commit SHA: ${{ github.sha }}
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore." \
            "$ASSET_PATH#$ASSET_NAME"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          
          if [ "$RELEASE_OUTCOME" == "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            
            echo "Release Tag: $TAG_NAME"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: ${{ steps.prepare_asset.outputs.asset_name }}"
            
            echo "### GitHub Release & APK Build Status" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: Success" >> $GITHUB_STEP_SUMMARY
            echo "- **Release URL**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Download Asset**: \`${{ steps.prepare_asset.outputs.asset_name }}\` available in release Assets." >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact**: \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or was skipped, but the debug APK build and Actions artifact upload succeeded."
            echo "=== GitHub Release Publishing Failed ==="
            echo "The APK build succeeded and the Actions artifact named app-debug-apk remains available."
            
            echo "### GitHub Release & APK Build Status" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Status**: Success (Artifact uploaded successfully)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Status**: Failed (continue-on-error active; actions artifact preserved)" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact**: \`app-debug-apk\` remains fully available for download." >> $GITHUB_STEP_SUMMARY
          fi
